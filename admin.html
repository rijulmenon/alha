<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALHA Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ── Login Screen ── -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-brand">ALHA</div>
                <p class="login-sub">Admin Portal</p>
                <p class="login-hint">Enter your credentials to continue</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" name="email"
                        placeholder="admin@alha.ae" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="password"
                        placeholder="Enter password" required autocomplete="current-password">
                </div>
                <div id="loginError" class="error-message" style="display:none;"></div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- ── Admin Dashboard ── -->
    <div id="adminDashboard" class="dashboard-container" style="display:none;">

        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="header-brand">
                    <span class="header-wordmark">ALHA</span>
                    <span class="header-subtitle">Admin Portal</span>
                </div>
                <div class="header-actions">
                    <span class="admin-badge" id="adminBadgeEmail">Admin</span>
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </div>
            </div>
        </header>

        <!-- Body -->
        <div class="dashboard-main">

            <!-- Sidebar -->
            <aside class="dashboard-sidebar">
                <nav class="sidebar-nav">
                    <button class="nav-item active" data-section="menu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                        </svg>
                        <span>Menu</span>
                    </button>
                    <button class="nav-item" data-section="journal">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        <span>Recipes</span>
                    </button>
                </nav>
            </aside>

            <!-- Content -->
            <main class="dashboard-content">

                <!-- Menu Section -->
                <section id="menuSection" class="content-section active">
                    <div class="section-header">
                        <h2>Menu</h2>
                        <button class="btn-primary" id="addMenuItemBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            Add Item
                        </button>
                    </div>
                    <div id="menuGrid" class="items-grid">
                        <div class="loading-spinner">Loading…</div>
                    </div>
                </section>

                <!-- Journal / Recipes Section -->
                <section id="journalSection" class="content-section">
                    <div class="section-header">
                        <h2>Recipes</h2>
                        <button class="btn-primary" id="addJournalBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            Add Recipe
                        </button>
                    </div>
                    <div id="journalGrid" class="items-grid">
                        <div class="loading-spinner">Loading…</div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Item</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="notification" class="notification" style="display:none;">
        <span id="notificationMessage"></span>
    </div>

    <!-- Scripts -->
    <script src="js/supabase-client.js"></script>
    <script src="js/products-service.js"></script>
    <script src="js/journal-service.js"></script>
    <script src="js/admin-service.js"></script>
    <script src="admin.js"></script>
</body>
</html>
